[build]
    command = "npm run build:site"
    publish = "dist/site"

[[headers]]
    for = "/*"
    [headers.values]
        X-Content-Type-Options = "nosniff"
        Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
    for = "/*.html"
    [headers.values]
        Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
    for = "/assets/*"
    [headers.values]
        Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
    for = "/css/*"
    [headers.values]
        Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
    for = "/js/*"
    [headers.values]
        Cache-Control = "public, max-age=3600, must-revalidate"

[[redirects]]
    from = "/financial-readiness"
    to = "/financial-readiness.html"
    status = 200

[[redirects]]
    from = "/computer-skills"
    to = "/intermediate-computer-skills.html"
    status = 200

[[redirects]]
    from = "/intermediate-computer-skills"
    to = "/intermediate-computer-skills.html"
    status = 200

[[redirects]]
    from = "/syllabus"
    to = "/syllabus.html"
    status = 200

[[redirects]]
    from = "/intake"
    to = "/intake.html"
    status = 200

[[redirects]]
    from = "/classes"
    to = "/classes/"
    status = 301

[[redirects]]
    from = "/assessments/*"
    to = "/📘 Assessments/:splat"
    status = 200

[[redirects]]
    from = "/handouts/*"
    to = "/📘 Handouts/:splat"
    status = 200

[[redirects]]
    from = "/study-resources/*"
    to = "/📘 Study Resources/:splat"
    status = 200

[[redirects]]
    from = "/teacher-guides/*"
    to = "/📘 Teacher Guides/:splat"
    status = 200

[[redirects]]
    from = "/*"
    to = "/404.html"
    status = 404

