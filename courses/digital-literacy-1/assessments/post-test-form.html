<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=/courses/digital-literacy-1/assessments/post-test.html">
  <link rel="canonical" href="/courses/digital-literacy-1/assessments/post-test.html">
  <title>Post-Test | Digital Literacy &mdash; Level 1</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #1B365D;
      --primary-dark: #0D1B2A;
      --accent: #C9A227;
      --accent-light: #E6C65C;
      --light: #FFFFFF;
      --off-white: #F5F7FA;
      --gray: #5A6A7A;
    }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
      color: var(--primary-dark);
      background: var(--off-white);
    }
    main {
      width: min(100%, 680px);
      background: var(--light);
      border: 1px solid #d8dde3;
      border-top: 8px solid var(--accent);
      border-radius: 10px;
      padding: 2rem;
      box-shadow: 0 10px 30px rgba(13, 27, 42, 0.12);
    }
    h1 {
      color: var(--primary);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.8rem;
      line-height: 1.25;
      margin-bottom: 0.75rem;
    }
    p { color: var(--gray); margin-bottom: 1rem; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0.7rem 1.1rem;
      border-radius: 8px;
      background: var(--primary);
      color: var(--light);
      font-weight: 700;
      text-decoration: none;
    }
    .btn:hover,
    .btn:focus { background: #2C4A7C; }
    .btn:focus-visible { outline: 3px solid var(--accent-light); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Opening the browser Post-Test</h1>
    <p>
      Digital Literacy &mdash; Level 1 now uses the browser-based assessment with a printable
      PDF report.
    </p>
    <p>If you are not redirected automatically, open the Post-Test below.</p>
    <a class="btn" href="/courses/digital-literacy-1/assessments/post-test.html">Open Post-Test</a>
  </main>
  <script>
    window.location.replace('/courses/digital-literacy-1/assessments/post-test.html');
  </script>
  <script src="/shared/text-size.js" defer></script>
</body>
</html>
